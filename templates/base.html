<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · BASIC 2 BASIC</title>
<link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body data-root="{{ root }}">
<header class="topbar">
  <a class="brand" href="{{ root }}index.html"><span class="cursor">█</span> BASIC 2 BASIC</a>
  <nav>
    <a href="{{ root }}index.html">Machines</a>
    <a href="{{ root }}actions.html">Actions</a>
    <a href="{{ root }}translator.html">Translator</a>
  </nav>
  <div class="search">
    <input id="search" type="search" placeholder="Search entries, dialects, tokens ($99)…" autocomplete="off" aria-label="Search">
    <ul id="results" hidden></ul>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Encyclopedia of the BASIC dialects of 8-bit computers · pages built from the database</footer>
<script src="{{ root }}static/search_index.js"></script>
<script src="{{ root }}static/search.js"></script>
{% block script %}{% endblock %}
</body>
</html>
